task:
  description: white-box FGSM evaluation of a pretrained TSC controller
  task_name: tsc

world:
  interval: 1.0
  seed: 0
  dir: data/

  saveReplay: False
  report_log_mode: normal
  report_log_rate: 10

  no_warning: True
  gui: False

  rlTrafficLight: True

trainer:
  thread: 4
  ngpu: -1
  learning_start: 5000
  buffer_size: 5000
  steps: 3500
  test_steps: 3600
  yellow_length: 5
  action_interval: 10
  episodes: 200
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: True

model:
  name: "non-rl"
  train_model: False   # EVAL ONLY -- this task never trains the victim
  test_model: True
  load_model: True
  graphic: False
  vehicle_max: 1
  learning_rate: 0.001
  batch_size: 64
  gamma: 0.95
  epsilon: 0.5
  epsilon_decay: 0.99
  epsilon_min: 0.05
  grad_clip: 5.0

  one_hot: False
  phase: False

logger:
  root_dir: "data/output_data/"
  log_dir: "logger/"
  replay_dir: "replay/"
  model_dir: "model/"
  data_dir: "dataset/"
  save_model: False
  save_rate: 5
  attention: False

# White-box FGSM attacker parameters. See attacker/FGSM.py for full docs.
attacker:
  epsilon: 0.15  # FGSM step size in normalized feature space
  pgd_steps: 2 
  max_vehicles_per_lane: 3            # cap on fake vehicles injected per lane per decision
  max_total_vehicles: 5            # optional global cap per decision (null = unlimited)
  allocation: "greedy" 
  top_k_lanes: null                   # optional: only attack the k highest-gradient lanes
  min_vehicles_per_selected_lane: 1
  fallback_to_largest_abs_grad: True
  targeted: False                     # untargeted: just try to flip the victim's decision
  model_attr: null                    # let FGSM auto-detect (agent.model for MPLight/FRAP)
  strict: False                       # if True, raise instead of silently skipping a failed attack
