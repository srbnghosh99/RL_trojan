model:
  name: mplight
  train_model: False   # EVAL ONLY -- must match the checkpoint's architecture below
  n_layers: 2
  rotation: true
  conflict_matrix: true
  merge: multiply
  d_dense: 20
  learning_rate: 0.001
  batch_size: 32
  gamma: 0.99
  eps_start: 1.0
  eps_end: 0.0
  eps_decay: 220
  target_update: 500
  demand_shape: 1
  phase: True

trainer:
  learning_start: -1
  buffer_size: 10000

